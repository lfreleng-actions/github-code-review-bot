---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable workflow: select open pull requests across an organisation,
# run one Copilot CLI review session per pull request against an offline
# packet and a read-only checkout, and let a trusted job act on the
# verdict. Two modes share the pipeline and differ in whose pull
# requests they read and in their one write:
#
#   approve       human-authored pull requests; the trusted job approves
#                 the trivial and low-risk ones and writes nothing else
#   antagonistic  pull requests by the bots config/antagonistic-authors.txt
#                 lists; the trusted job posts one COMMENT review with
#                 the findings inline, and never approves
#
# Each mode runs under its own App (config/bot.json and
# config/antagonistic-bot.json), which the pre-flight identity checks
# enforce, so neither mode's key can act for the other.
#
# Trust boundary (docs/DESIGN.md sections 4 and 5): the review job
# holds no repository credential and never sees the App key. It emits
# a verdict; the apply job treats it as hostile input, corroborates it
# offline, re-reads the live pull request, and makes the one write
# with a per-repository App token.
name: 'Code Review Bot [R] 🤖'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      org:
        description: 'Target owner; live runs require an organisation App'
        required: true
        type: string
      mode:
        description: >-
          approve (human pull requests, may approve) or antagonistic
          (listed bots' pull requests, may comment, never approves)
        type: string
        default: 'approve'
      dry_run:
        description: 'Run the agent and the checks; write nothing'
        type: boolean
        default: true
      model:
        description: 'Copilot CLI model identifier'
        type: string
        default: 'claude-opus-5.5'
      approve_tiers:
        description: >-
          Tiers the run may approve: trivial,low-risk (default),
          trivial, or none for a report-only run; the antagonistic
          mode requires none
        type: string
        default: 'trivial,low-risk'
      pull_requests:
        description: >-
          Pull requests to review instead of scanning: repo/pull/N,
          owner/repo/pull/N, repo#N or URLs; commas and/or spaces
        type: string
        default: ''
      repositories:
        description: 'Repositories to scan; commas and/or spaces'
        type: string
        default: ''
      exclude_repos:
        description: 'Repos to skip, commas and/or spaces; overrides bundle'
        type: string
        default: ''
      max_pull_requests:
        description: 'Pull requests to review at most; 0 lifts the cap'
        type: string
        default: '20'
      stale_status_minutes:
        description: >-
          Minutes a listed commit status (config/stale-statuses.txt) may
          stay pending before CI is judged without it; 0 disables
        type: string
        default: '8'
      max_concurrent_agents:
        description: 'Review sessions running at once (1-30)'
        type: string
        default: '5'
      max_runtime_minutes:
        description: 'Wall-clock budget for each review session'
        type: string
        default: '20'
      reassess:
        description: 'Review heads the ledger already records'
        type: boolean
        default: false
      skip_agent:
        description: 'Plumbing test: select and report without sessions'
        type: boolean
        default: false
      harden_runner_egress:
        description: 'harden-runner egress for trusted jobs: audit or block'
        type: string
        default: 'block'
      harden_runner_allowlist:
        description: 'harden-runner-block-action config coordinate'
        type: string
        default: ''
      harden_runner_supplemental_allowlist:
        description: >-
          Extra harden-runner allow-list merged with
          harden_runner_allowlist, in the same coordinate grammar.
          Empty adds nothing
        required: false
        type: string
        default: ''
      harden_runner_supplemental_unpinned:
        description: >-
          Let harden_runner_supplemental_allowlist omit '@ref' and
          follow its default branch; only a list in the caller's own
          organisation qualifies
        required: false
        type: boolean
        default: false
      harden_runner_extra_endpoints:
        description: >-
          Extra egress endpoints written inline, host[:port] tokens
          separated by spaces or newlines, merged into the allow-list
          for short-lived fixes. Empty adds nothing
        required: false
        type: string
        default: ''
      github_app_client_id:
        description: 'GitHub App client id; empty limits runs to dry-run'
        type: string
        default: ''
      handback_repository:
        description: >-
          owner/repo whose code-monkey-cron.yaml an antagonistic run
          dispatches to revise the bot pull requests it reviewed;
          empty hands nothing back
        type: string
        default: ''
      assets_repository:
        description: 'Trusted repository providing the prompt and scripts'
        type: string
        default: 'lfreleng-actions/github-code-review-bot'
      assets_ref:
        description: >-
          Commit, tag or branch of the assets; empty resolves the
          calling workflow's own commit
        type: string
        default: ''
    secrets:
      copilot_token:
        description: >-
          Personal fine-grained PAT with Copilot Requests and no
          repository grants; the only credential the agent receives
        required: false
      github_app_private_key:
        description: 'GitHub App private key, used in trusted jobs alone'
        required: false
      handback_token:
        description: >-
          Token with Actions write on handback_repository alone; the
          hand-back job holds it and nothing else does
        required: false

permissions: {}

# Live approve runs hold one lock per caller repository and owner
# across the whole pipeline. Dry runs write nothing, so they lock
# within their own caller run and never cancel or wait on a live run.
# Antagonistic runs are dispatched per batch of bot pull requests, so
# they too lock within their own run rather than evict each other; the
# apply job's live re-read refuses a head the bot already reviewed.
concurrency:
  group: >-
    ${{ inputs.dry_run
    && format('code-review-dry-run-{0}-{1}', github.run_id, inputs.org)
    || inputs.mode == 'antagonistic'
    && format('code-review-antagonistic-{0}-{1}', github.run_id, inputs.org)
    || format('code-review-{0}-{1}', github.repository, inputs.org) }}
  cancel-in-progress: false

jobs:
  select:
    name: 'Select'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    permissions:
      pull-requests: read  # Candidate scan without an App (dry-run plumbing)
      contents: read  # Checkout trusted assets; read public repositories
      actions: read  # Fetch prior ledgers from this repository's runs
    outputs:
      assets_sha: "${{ steps.pinned.outputs.sha }}"
      namespace: "${{ steps.identity.outputs.namespace }}"
      evidence_id: "${{ steps.evidence.outputs.artifact-id }}"
      selection_sha256: "${{ steps.digests.outputs.selection }}"
      ledger_sha256: "${{ steps.digests.outputs.ledger }}"
      bot_config: "${{ steps.budget.outputs.bot_config }}"
      ledger_name: "${{ steps.budget.outputs.ledger_name }}"
      count: "${{ steps.chosen.outputs.count }}"
      matrix: "${{ steps.chosen.outputs.matrix }}"
      run_agent: "${{ steps.chosen.outputs.run_agent }}"
      review_timeout: "${{ steps.budget.outputs.review_timeout }}"
      agent_timeout: "${{ steps.budget.outputs.agent_timeout }}"
      max_parallel: "${{ steps.budget.outputs.max_parallel }}"
    steps:
      - name: 'Load egress allow-list'
        if: inputs.harden_runner_egress == 'block'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
        with:
          config: "${{ inputs.harden_runner_allowlist }}"
          # yamllint disable-line rule:line-length
          supplemental_config: "${{ inputs.harden_runner_supplemental_allowlist }}"
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: "${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}"
          # yamllint disable-line rule:line-length
          supplemental_unpinned: "${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}"
          extra_endpoints: "${{ inputs.harden_runner_extra_endpoints }}"
          allow_list_summary: 'true'

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: "${{ inputs.harden_runner_egress }}"
          allowed-endpoints: "${{ env.CONNECTION_ALLOW_LIST }}"

      - name: 'Allocate invocation identity'
        id: identity
        env:
          RUN_ID: "${{ github.run_id }}"
          RUN_ATTEMPT: "${{ github.run_attempt }}"
        run: |
          python3 - <<'PY'
          import os, uuid
          run = os.environ['RUN_ID']
          attempt = os.environ['RUN_ATTEMPT']
          namespace = f"{run}-{attempt}-{uuid.uuid4().hex}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'namespace={namespace}\n')
          PY

      - name: 'Check inputs'
        id: budget
        env:
          MAX_PRS: "${{ inputs.max_pull_requests }}"
          STALE_MINUTES: "${{ inputs.stale_status_minutes }}"
          MAX_RUNTIME: "${{ inputs.max_runtime_minutes }}"
          MAX_AGENTS: "${{ inputs.max_concurrent_agents }}"
          MODEL: "${{ inputs.model }}"
          MODE: "${{ inputs.mode }}"
          APPROVE_TIERS: "${{ inputs.approve_tiers }}"
        run: |
          [[ "$MAX_PRS" =~ ^[0-9]+$ ]] || {
            echo '::error::max_pull_requests must be a non-negative integer'
            exit 1; }
          [[ "$STALE_MINUTES" =~ ^[0-9]+$ ]] || {
            echo '::error::stale_status_minutes must be a non-negative integer'
            exit 1; }
          [[ "$MAX_RUNTIME" =~ ^[1-9][0-9]*$ ]] && [ "$MAX_RUNTIME" -le 120 ] ||
            { echo '::error::max_runtime_minutes must be 1-120'; exit 1; }
          [[ "$MAX_AGENTS" =~ ^[1-9][0-9]*$ ]] && [ "$MAX_AGENTS" -le 30 ] || {
            echo '::error::max_concurrent_agents must be 1-30'; exit 1; }
          [[ "$MODEL" =~ ^[a-z0-9.-]+$ ]] || {
            echo '::error::model must be a lower-case identifier'; exit 1; }
          case "$APPROVE_TIERS" in
            'trivial,low-risk'|'low-risk,trivial') ;;
            'trivial'|'low-risk'|'none'|'') ;;
            *) echo '::error::approve_tiers must name trivial, low-risk or none'
               exit 1 ;;
          esac
          # Each mode names the App it must run under and keeps its own
          # memory. The antagonistic mode can never approve, so a tier
          # passed to it is a misconfigured caller, refused here.
          case "$MODE" in
            approve)
              bot_config='config/bot.json'
              ledger_name='code-review-ledger' ;;
            antagonistic)
              case "$APPROVE_TIERS" in
                'none'|'') ;;
                *) echo '::error::the antagonistic mode approves nothing'
                   exit 1 ;;
              esac
              bot_config='config/antagonistic-bot.json'
              ledger_name='code-review-antagonistic-ledger' ;;
            *) echo '::error::mode must be approve or antagonistic'; exit 1 ;;
          esac
          # Expressions cannot add, so the job budget (session plus
          # toolchain setup and upload) is computed here.
          {
            echo "agent_timeout=$MAX_RUNTIME"
            echo "review_timeout=$((MAX_RUNTIME + 15))"
            echo "max_parallel=$MAX_AGENTS"
            echo "bot_config=$bot_config"
            echo "ledger_name=$ledger_name"
          } >> "$GITHUB_OUTPUT"

      # Operator lists: commas, spaces or newlines between items of
      # the target owner. Each splits offline, with no token, and a
      # bad item fails the run before the App key is used, every
      # mistake reported at once. Repeats collapse without regard to
      # case; a pull request publishes as owner/repo#N whichever of
      # the accepted spellings named it.
      - name: 'Split repositories'
        id: repositories
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/list-splitter-action@7bf2f3ab24d636464db599ce349bf345910c08d6  # v0.1.1
        with:
          list: "${{ inputs.repositories }}"
          validate: 'repository'
          owner: "${{ inputs.org }}"
          token: ''

      - name: 'Split excluded repositories'
        id: exclusions
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/list-splitter-action@7bf2f3ab24d636464db599ce349bf345910c08d6  # v0.1.1
        with:
          list: "${{ inputs.exclude_repos }}"
          validate: 'repository'
          owner: "${{ inputs.org }}"
          token: ''

      - name: 'Split pull requests'
        id: pulls
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/list-splitter-action@7bf2f3ab24d636464db599ce349bf345910c08d6  # v0.1.1
        with:
          list: "${{ inputs.pull_requests }}"
          validate: 'pull-request'
          owner: "${{ inputs.org }}"
          token: ''

      - name: 'Require App for live runs'
        if: ${{ !inputs.dry_run && inputs.github_app_client_id == '' }}
        run: |
          echo '::error::Live runs require organisation App credentials'
          exit 1

      - name: 'Resolve assets ref'
        id: assets
        env:
          ASSETS_REF: "${{ inputs.assets_ref }}"
          # yamllint disable-line rule:line-length
          JOB_WORKFLOW_SHA: "${{ job.workflow_sha || github.job_workflow_sha }}"
        run: |
          ref="${ASSETS_REF:-$JOB_WORKFLOW_SHA}"
          if [ -z "$ref" ]; then
            echo '::error::Cannot resolve workflow commit; set assets_ref'
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: 'Checkout trusted assets'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ steps.assets.outputs.ref }}"
          path: 'review-assets'
          persist-credentials: false

      - name: 'Pin assets commit'
        id: pinned
        run: |
          sha="$(git -C review-assets rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Pre-flight gate (docs/DESIGN.md section 4.4). The contract tests
      # and zizmor run again here, from the pinned assets, so a drift
      # merged into the workflow fails this run before any token exists.
      # The config check reads the credential shapes from the
      # environment and prints nothing it read.
      #
      # No uv step may run a Python interpreter that the workspace or
      # the job's environment chose (docs/DESIGN.md section 4.4).
      # setup-uv reads uv settings in its working directory, so it runs
      # from the runner's temporary directory with config and project
      # discovery off, and installs tools outside the workspace.
      - name: 'Set up uv'
        id: setup-uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          working-directory: "${{ runner.temp }}"
          tool-bin-dir: "${{ runner.temp }}/uv-tool-bin"
          # The post-step cache prune would hit the invalid preference.
          enable-cache: false
        env:
          UV_NO_CONFIG: '1'
          UV_NO_PROJECT: '1'
          # setup-uv's only uv call here is "uv python find", whose
          # result it executes; an invalid preference makes uv refuse
          # its arguments before any lookup.
          UV_PYTHON_PREFERENCE: 'lookup-disabled'
          # Inherited, it makes setup-uv probe uv, which the line above
          # fails.
          UV_PYTHON_ARCH: ''
          # setup-uv puts this directory on PATH ahead of its own uv and
          # then runs a bare uv, so an inherited value could name a
          # directory holding another uv; pin it to the one the
          # "Install Python" step installs into.
          UV_PYTHON_INSTALL_DIR: "${{ runner.temp }}/uv-python"

      # The one interpreter every later uv call names by absolute path.
      # uv installs it with an emptied environment, so no variable the
      # job carries can steer the install or the lookup, and the result
      # must sit in the directory it was installed to. It runs outside
      # the checkout: uv python find starts a .venv/bin/python in its
      # working directory to query it, even under env -i.
      - name: 'Install Python'
        id: python
        shell: bash
        working-directory: "${{ runner.temp }}"
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          INSTALL_DIR: "${{ runner.temp }}/uv-python"
        run: |
          clean=(UV_NO_CONFIG=1 UV_NO_PROJECT=1
            "UV_PYTHON_INSTALL_DIR=$INSTALL_DIR"
            "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache")
          for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy \
              https_proxy all_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR \
              UV_NATIVE_TLS; do
            if value="$(printenv "$name")"; then clean+=("$name=$value"); fi
          done
          env -i "${clean[@]}" "$UV" python install --quiet --no-bin 3.13
          py="$(env -i "${clean[@]}" "$UV" python find --managed-python 3.13)"
          case "$py" in
            "$INSTALL_DIR"/*) ;;
            *) echo "::error::uv found Python outside its install directory"
               exit 1 ;;
          esac
          echo "path=$py" >> "$GITHUB_OUTPUT"

      - name: 'Install zizmor'
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          PYTHON: "${{ steps.python.outputs.path }}"
          UV_NO_CONFIG: '1'
          UV_NO_PROJECT: '1'
        run: |
          "$UV" tool install --python "$PYTHON" 'zizmor==1.30.1'

      # uv run uses the interpreter of an existing project environment,
      # whatever --python says, so the environment lives outside the
      # workspace too.
      - name: 'Pre-flight: workflow contracts and audit'
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          PYTHON: "${{ steps.python.outputs.path }}"
          UV_PROJECT_ENVIRONMENT: "${{ runner.temp }}/preflight-venv"
        run: |
          cd review-assets
          "$UV" run --locked --python "$PYTHON" \
            python -B scripts/preflight.py workflow --root .

      - name: 'Pre-flight: configuration and credentials'
        env:
          BOT_APP_CLIENT_ID: "${{ inputs.github_app_client_id }}"
          BOT_APP_PRIVATE_KEY: "${{ secrets.github_app_private_key }}"
          COPILOT_GITHUB_TOKEN: "${{ secrets.copilot_token }}"
          EGRESS_POLICY: "${{ inputs.harden_runner_egress }}"
          EGRESS_ALLOW_CONFIG: "${{ inputs.harden_runner_allowlist }}"
          DRY_RUN: "${{ inputs.dry_run }}"
          BOT_CONFIG: "${{ steps.budget.outputs.bot_config }}"
          # yamllint disable-line rule:line-length
          JOB_WORKFLOW_SHA: "${{ job.workflow_sha || github.job_workflow_sha }}"
          ASSETS_SHA: "${{ steps.pinned.outputs.sha }}"
        run: |
          extra=()
          if [ "$DRY_RUN" = true ]; then extra+=(--dry-run); fi
          python3 review-assets/scripts/preflight.py config \
            --config "review-assets/$BOT_CONFIG" \
            --egress-policy "$EGRESS_POLICY" \
            --egress-allow-config "$EGRESS_ALLOW_CONFIG" \
            --workflow-sha "$JOB_WORKFLOW_SHA" \
            --assets-sha "$ASSETS_SHA" "${extra[@]}"

      - name: 'Mint read-only App token'
        id: app-token
        if: inputs.github_app_client_id != ''
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: "${{ inputs.github_app_client_id }}"
          private-key: "${{ secrets.github_app_private_key }}"
          owner: "${{ inputs.org }}"
          # The repositories of the named pull requests, else the named
          # repositories. Empty means every repository of the owner:
          # the candidate scan is organisation-wide by design and this
          # token reads.
          repositories: >-
            ${{ steps.pulls.outputs.count != '0'
            && steps.pulls.outputs.repositories
            || steps.repositories.outputs.repositories }}
          permission-pull-requests: 'read'
          permission-contents: 'read'
          permission-checks: 'read'
          permission-statuses: 'read'
          permission-metadata: 'read'

      # The slug the mint returns is the one signal that says whose key
      # was wired in; a probe with the token proves it cannot write.
      - name: 'Pre-flight: App identity and token grants'
        if: inputs.github_app_client_id != ''
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
          MINTED_SLUG: "${{ steps.app-token.outputs.app-slug }}"
          BOT_CONFIG: "${{ steps.budget.outputs.bot_config }}"
          REPOSITORY: "${{ github.repository }}"
        run: |
          python3 review-assets/scripts/preflight.py identity \
            --config "review-assets/$BOT_CONFIG" --minted-slug "$MINTED_SLUG"
          python3 review-assets/scripts/preflight.py token \
            --repository "$REPOSITORY"

      # The ledger lives in this repository's own artifacts, so the
      # native token reads it; the App token has no grant here. Each
      # mode keeps its own: an approve assessment says nothing about
      # an antagonistic review of the same head, nor the reverse.
      - name: 'Fetch prior ledger'
        env:
          GH_TOKEN: "${{ github.token }}"
          REPOSITORY: "${{ github.repository }}"
          LEDGER_NAME: "${{ steps.budget.outputs.ledger_name }}"
        run: |
          python3 review-assets/scripts/ledger.py fetch \
            --repository "$REPOSITORY" --output artefacts/ledger.json \
            --artifact-name "$LEDGER_NAME"

      - name: 'Select pull requests'
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token || github.token }}"
          ORG: "${{ inputs.org }}"
          MODE: "${{ inputs.mode }}"
          MODEL: "${{ inputs.model }}"
          DRY_RUN: "${{ inputs.dry_run }}"
          REASSESS: "${{ inputs.reassess }}"
          APPROVE_TIERS: "${{ inputs.approve_tiers }}"
          PULL_REQUESTS: "${{ steps.pulls.outputs.csv }}"
          REPOSITORIES: "${{ steps.repositories.outputs.csv }}"
          EXCLUDE_REPOS: "${{ steps.exclusions.outputs.csv }}"
          MAX_PRS: "${{ inputs.max_pull_requests }}"
          STALE_MINUTES: "${{ inputs.stale_status_minutes }}"
          BOT_SLUG: "${{ steps.app-token.outputs.app-slug }}"
        run: |
          extra=()
          if [ "$DRY_RUN" = true ]; then extra+=(--dry-run); fi
          if [ "$REASSESS" = true ]; then extra+=(--reassess); fi
          python3 review-assets/scripts/select_pulls.py \
            --org "$ORG" --mode "$MODE" --output-dir artefacts \
            --model "$MODEL" --approve-tiers "$APPROVE_TIERS" \
            --ledger artefacts/ledger.json \
            --pull-requests "$PULL_REQUESTS" \
            --repositories "$REPOSITORIES" \
            --exclude-file review-assets/config/excluded-repos.txt \
            --exclude-repos "$EXCLUDE_REPOS" \
            --bot-authors-file review-assets/config/antagonistic-authors.txt \
            --handback-authors-file review-assets/config/handback-authors.txt \
            --max-pull-requests "$MAX_PRS" \
            --stale-statuses-file review-assets/config/stale-statuses.txt \
            --stale-status-minutes "$STALE_MINUTES" \
            --bot-slug "$BOT_SLUG" "${extra[@]}"
          cat artefacts/selection-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 'Publish selection outputs'
        id: chosen
        env:
          SKIP_AGENT: "${{ inputs.skip_agent }}"
        run: |
          count="$(jq '.include | length' artefacts/matrix.json)"
          [[ "$count" =~ ^[0-9]+$ ]]
          run_agent=false
          if [ "$SKIP_AGENT" != true ] && [ "$count" != 0 ]; then
            run_agent=true
          fi
          {
            echo "count=$count"
            echo "run_agent=$run_agent"
            echo "matrix=$(jq -c . artefacts/matrix.json)"
          } >> "$GITHUB_OUTPUT"

      - name: 'Record evidence digests'
        id: digests
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, path in (('selection', 'selection.json'),
                                 ('ledger', 'ledger.json')):
                  content = pathlib.Path('artefacts', path).read_bytes()
                  output.write(f'{name}={hashlib.sha256(content).hexdigest()}\n')
          PY

      # Artifact IDs and file digests come from this trusted job.
      # An artifact name alone is not an integrity boundary.
      - name: 'Publish selection evidence'
        id: evidence
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "code-review-evidence-${{ steps.identity.outputs.namespace }}"
          path: 'artefacts/'
          retention-days: 7
          if-no-files-found: 'error'

  review:
    name: 'Review (${{ matrix.key }})'
    needs: 'select'
    if: needs.select.outputs.run_agent == 'true'
    runs-on: 'ubuntu-latest'
    # Session budget plus toolchain setup and artifact upload.
    timeout-minutes: ${{ fromJSON(needs.select.outputs.review_timeout) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.select.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    permissions:
      contents: read  # Checkout assets and the public head repository
    steps:
      # Always audit: the model backend (api.githubcopilot.com) is not
      # in the organisation allow-list, and this job holds nothing a
      # block could protect beyond the model credential.
      - name: 'Harden runner (audit)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      - name: 'Require pinned provenance'
        env:
          ASSETS_SHA: "${{ needs.select.outputs.assets_sha }}"
          HEAD_SHA: "${{ matrix.head_sha }}"
          KEY: "${{ matrix.key }}"
          HEAD_REPOSITORY: "${{ matrix.head_repository }}"
        run: |
          [[ "$ASSETS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$KEY" =~ ^[A-Za-z0-9_.-]+$ ]]
          repo_re='^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9._-]+$'
          [[ "$HEAD_REPOSITORY" =~ $repo_re ]]

      - name: 'Checkout prompt assets'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ needs.select.outputs.assets_sha }}"
          path: 'review-assets'
          persist-credentials: false

      - name: 'Fetch selection evidence'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: "${{ needs.select.outputs.evidence_id }}"
          merge-multiple: true
          path: 'evidence'

      - name: 'Verify evidence bytes'
        env:
          SELECTION_SHA: "${{ needs.select.outputs.selection_sha256 }}"
          LEDGER_SHA: "${{ needs.select.outputs.ledger_sha256 }}"
        run: |
          python3 review-assets/scripts/bot_evidence.py verify \
            --directory evidence --expect "selection.json=$SELECTION_SHA" \
            --expect "ledger.json=$LEDGER_SHA"

      # The default token has no grant on the head repository; the
      # checkout succeeds because the estate is public. The checkout
      # is context for the agent, read with the same tools as the
      # packet; nothing here can push.
      - name: 'Checkout pull request head'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ matrix.head_repository }}"
          ref: "${{ matrix.head_sha }}"
          path: 'workspace'
          persist-credentials: false

      - name: 'Set up Node.js'
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: 'Install Copilot CLI'
        env:
          PIN_DIR: 'review-assets/tools/copilot-cli'
        run: |
          # npm ci from the committed lockfile rather than npm install
          # of a version: the lockfile pins the whole tree by integrity
          # hash. The pin comes from the verified assets checkout and
          # installs outside the workspace the session reads.
          dest="$RUNNER_TEMP/copilot-cli"
          mkdir -p "$dest"
          cp "$PIN_DIR/package.json" "$PIN_DIR/package-lock.json" \
            "$PIN_DIR/.npmrc" "$dest/"
          cd "$dest"
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$dest/node_modules/.bin" >> "$GITHUB_PATH"

      - name: 'Prepare packet and prompt'
        id: packet
        env:
          KEY: "${{ matrix.key }}"
          HEAD_SHA: "${{ matrix.head_sha }}"
          MODE: "${{ inputs.mode }}"
          DRY_RUN: "${{ inputs.dry_run }}"
          APPROVE_TIERS: "${{ inputs.approve_tiers }}"
        run: |
          mkdir -p artefacts
          jq -e --arg key "$KEY" '.pull_requests[] | select(.key == $key)' \
            evidence/selection.json > artefacts/pull.json
          repository="$(jq -r '.repository' artefacts/pull.json)"
          number="$(jq -r '.number' artefacts/pull.json)"
          [[ "$repository" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9._-]+$ ]]
          [[ "$number" =~ ^[1-9][0-9]*$ ]]
          [ "$(jq -r '.head_sha' artefacts/pull.json)" = "$HEAD_SHA" ]
          [ "$(git -C workspace rev-parse HEAD)" = "$HEAD_SHA" ]
          case "$MODE" in
            approve)
              task='review-assets/prompt/review.md'
              power="approvable tiers: \`${APPROVE_TIERS:-none}\`" ;;
            antagonistic)
              task='review-assets/prompt/antagonistic.md'
              power='the trusted job may comment, never approve' ;;
            *) echo '::error::unknown mode'; exit 1 ;;
          esac
          # shellcheck disable=SC2016  # literal backticks for markdown
          {
            cat "$task"
            printf '\n## Runtime context\n\n'
            printf -- '- repository: `%s`\n' "$repository"
            printf -- '- pull_request: `%s`\n' "$number"
            printf -- '- head_sha: `%s`\n' "$HEAD_SHA"
            printf -- '- mode: `%s`; dry run: `%s`; %s\n' \
              "$MODE" "$DRY_RUN" "$power"
            printf -- '- packet: `artefacts/pull.json`\n'
            printf -- '- checkout of the head commit: `workspace/`\n'
          } > artefacts/prompt.md

      - name: 'Run review agent (Copilot)'
        id: agent
        timeout-minutes: ${{ fromJSON(needs.select.outputs.agent_timeout) }}
        env:
          COPILOT_GITHUB_TOKEN: "${{ secrets.copilot_token }}"
          COPILOT_HOME: "${{ runner.temp }}/copilot"
          MODEL: "${{ inputs.model }}"
        run: |
          # The prefix rejects native/classic tokens, not extra PAT
          # grants. The caller must provision Copilot Requests only.
          case "$COPILOT_GITHUB_TOKEN" in
            github_pat_*) ;;
            *)
              echo '::error::Use a model-only fine-grained Copilot PAT'
              exit 1 ;;
          esac
          mkdir -p artefacts/copilot-logs
          prompt="$(cat artefacts/prompt.md)"
          # Read-only utilities for the packet and the checkout. The
          # CLI auto-approves what it classifies as a read, so the
          # allow list states intent; enforcement is the missing
          # credential, the deny list below and the apply job's own
          # checks. awk, sed and find stay out: each can write or run
          # commands, which would hand a bypass to a prompt-injected
          # pull request.
          allow=''
          for cmd in cat jq grep head tail wc ls; do
            allow="$allow,shell($cmd),shell($cmd:*)"
          done
          copilot \
            --prompt="$prompt" \
            --model="$MODEL" \
            --available-tools=bash,list_bash,read_bash,stop_bash \
            --allow-tool="${allow#,}" \
            --deny-tool='write,shell(gh),shell(gh:*),shell(git),shell(git:*)' \
            --secret-env-vars=COPILOT_GITHUB_TOKEN \
            --no-ask-user --no-custom-instructions --disable-builtin-mcps \
            --no-auto-update --no-color \
            --log-dir=artefacts/copilot-logs \
            --usage-output-file artefacts/usage.json \
            --share=artefacts/session-summary.md

      - name: 'Preserve session output'
        if: always() && steps.packet.outcome == 'success'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One name per pull request across attempts, so the apply
          # job always finds it; a rerun of this entry replaces its
          # own earlier session instead of colliding with it.
          # yamllint disable-line rule:line-length
          name: "code-review-session-${{ needs.select.outputs.namespace }}-${{ matrix.key }}"
          path: |
            artefacts/session-summary.md
            artefacts/usage.json
            artefacts/prompt.md
            artefacts/copilot-logs/
          retention-days: 7
          overwrite: true
          if-no-files-found: 'warn'

      # Hygiene, not secure erasure: plain deletion of the CLI's
      # spilled tool output, its home and the checkout, on a
      # single-use VM. continue-on-error because cleanup must never
      # gate the apply path.
      - name: 'Clear session scratch files'
        if: always()
        continue-on-error: true
        env:
          COPILOT_HOME: "${{ runner.temp }}/copilot"
        run: |
          scratch="${TMPDIR:-/tmp}"
          found=$(find "$scratch" -maxdepth 1 -type f \
            -name '*-copilot-tool-output-*' -print -delete)
          removed=0
          if [ -n "$found" ]; then
            removed=$(printf '%s\n' "$found" | wc -l | tr -d '[:space:]')
          fi
          rm -rf "$COPILOT_HOME" workspace
          echo "Cleared $removed spilled tool-output file(s), the CLI home" \
            "and the checkout."

  # The session artifact uploads after a timeout or a CLI failure too,
  # and a rerun whose upload failed leaves the earlier attempt's, so
  # the antagonistic check settles a refusal only when GitHub's own
  # record of the run shows that leg's agent step and upload both
  # succeeded. One listing of the run's jobs serves every leg, rather
  # than one per applier; any doubt reads as unknown and leaves the
  # refusal unsettled.
  outcomes:
    name: 'Agent outcomes'
    needs: [select, review]
    if: >-
      !cancelled() && needs.select.result == 'success' &&
      needs.select.outputs.run_agent == 'true' &&
      inputs.mode == 'antagonistic'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      actions: read  # List this run's jobs and their step outcomes
      contents: read  # Checkout the outcome reader
    outputs:
      outcomes: "${{ steps.agent-outcome.outputs.outcomes }}"
    steps:
      - name: 'Load egress allow-list'
        if: inputs.harden_runner_egress == 'block'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
        with:
          config: "${{ inputs.harden_runner_allowlist }}"
          # yamllint disable-line rule:line-length
          supplemental_config: "${{ inputs.harden_runner_supplemental_allowlist }}"
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: "${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}"
          # yamllint disable-line rule:line-length
          supplemental_unpinned: "${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}"
          extra_endpoints: "${{ inputs.harden_runner_extra_endpoints }}"
          allow_list_summary: 'false'

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: "${{ inputs.harden_runner_egress }}"
          allowed-endpoints: "${{ env.CONNECTION_ALLOW_LIST }}"

      - name: 'Require trusted provenance'
        env:
          ASSETS_SHA: "${{ needs.select.outputs.assets_sha }}"
          EVIDENCE_ID: "${{ needs.select.outputs.evidence_id }}"
          SELECTION_SHA: "${{ needs.select.outputs.selection_sha256 }}"
          LEDGER_SHA: "${{ needs.select.outputs.ledger_sha256 }}"
        run: |
          [[ "$ASSETS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SELECTION_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$LEDGER_SHA" =~ ^[0-9a-f]{64}$ ]]

      - name: 'Checkout outcome reader'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ needs.select.outputs.assets_sha }}"
          path: 'review-assets'
          persist-credentials: false

      - name: 'Fetch selection evidence'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: "${{ needs.select.outputs.evidence_id }}"
          merge-multiple: true
          path: 'evidence'

      - name: 'Verify evidence bytes'
        env:
          SELECTION_SHA: "${{ needs.select.outputs.selection_sha256 }}"
          LEDGER_SHA: "${{ needs.select.outputs.ledger_sha256 }}"
        run: |
          python3 review-assets/scripts/bot_evidence.py verify \
            --directory evidence --expect "selection.json=$SELECTION_SHA" \
            --expect "ledger.json=$LEDGER_SHA"

      - name: 'Read agent step outcomes'
        id: agent-outcome
        env:
          GH_TOKEN: "${{ github.token }}"
          REPOSITORY: "${{ github.repository }}"
          RUN_ID: "${{ github.run_id }}"
        run: |
          python3 review-assets/scripts/agent_outcome.py \
            --repository "$REPOSITORY" --run-id "$RUN_ID" \
            --selection evidence/selection.json >> "$GITHUB_OUTPUT"

  apply:
    name: 'Apply (${{ matrix.key }})'
    needs: [select, review, outcomes]
    # Runs after every review entry, including failed ones, so each
    # pull request gets a verdict; never after cancellation or a
    # failed selection. A skipped or failed outcomes job (the approve
    # mode never runs it) leaves every agent outcome unknown.
    if: >-
      !cancelled() && needs.select.result == 'success' &&
      needs.select.outputs.run_agent == 'true'
    # Live antagonistic runs each lock within their own run (see the
    # workflow group), so two dispatches naming one pull request could
    # both read it before either posts. This lock spans runs, one per
    # pull request whatever the head, so the live re-read, the round
    # count and the post are one step: the next applier's re-read sees
    # the review and refuses the head, or counts it toward the cap.
    # queue: max keeps every waiting job, so a late job for an older
    # head waits its turn rather than evicting the current head's.
    # Every other path keeps a group of its own per leg: the approve
    # mode's live runs already serialise above.
    concurrency:
      group: >-
        ${{ inputs.mode == 'antagonistic' && !inputs.dry_run
        && format('code-review-antagonistic-apply-{0}-{1}',
        matrix.repository, matrix.number)
        || format('code-review-apply-{0}-{1}-{2}',
        github.run_id, github.run_attempt, matrix.key) }}
      cancel-in-progress: false
      queue: max
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    permissions:
      actions: read  # Locate the session artifact for this matrix key
      contents: read  # Checkout the trusted applier
    steps:
      - name: 'Load egress allow-list'
        if: inputs.harden_runner_egress == 'block'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
        with:
          config: "${{ inputs.harden_runner_allowlist }}"
          # yamllint disable-line rule:line-length
          supplemental_config: "${{ inputs.harden_runner_supplemental_allowlist }}"
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: "${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}"
          # yamllint disable-line rule:line-length
          supplemental_unpinned: "${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}"
          extra_endpoints: "${{ inputs.harden_runner_extra_endpoints }}"
          allow_list_summary: 'false'

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: "${{ inputs.harden_runner_egress }}"
          allowed-endpoints: "${{ env.CONNECTION_ALLOW_LIST }}"

      - name: 'Require trusted provenance'
        env:
          ASSETS_SHA: "${{ needs.select.outputs.assets_sha }}"
          EVIDENCE_ID: "${{ needs.select.outputs.evidence_id }}"
          SELECTION_SHA: "${{ needs.select.outputs.selection_sha256 }}"
          LEDGER_SHA: "${{ needs.select.outputs.ledger_sha256 }}"
          KEY: "${{ matrix.key }}"
        run: |
          [[ "$ASSETS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SELECTION_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$LEDGER_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$KEY" =~ ^[A-Za-z0-9_.-]+$ ]]

      - name: 'Checkout trusted applier'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ needs.select.outputs.assets_sha }}"
          path: 'review-assets'
          persist-credentials: false

      - name: 'Fetch selection evidence'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: "${{ needs.select.outputs.evidence_id }}"
          merge-multiple: true
          path: 'evidence'

      - name: 'Verify evidence bytes'
        id: verified
        env:
          SELECTION_SHA: "${{ needs.select.outputs.selection_sha256 }}"
          LEDGER_SHA: "${{ needs.select.outputs.ledger_sha256 }}"
        run: |
          python3 review-assets/scripts/bot_evidence.py verify \
            --directory evidence --expect "selection.json=$SELECTION_SHA" \
            --expect "ledger.json=$LEDGER_SHA"

      # The session is untrusted whatever its name, and its archive is
      # never extracted blindly: artifact_fetch.py bounds the zip size,
      # entry count and each file before writing anything. A missing
      # or refused artifact still yields a verdict for this pull
      # request, through the --failure text below.
      - name: 'Fetch and accept bounded session'
        id: fetch
        env:
          GH_TOKEN: "${{ github.token }}"
          REPOSITORY: "${{ github.repository }}"
          RUN_ID: "${{ github.run_id }}"
          # yamllint disable-line rule:line-length
          NAME: "code-review-session-${{ needs.select.outputs.namespace }}-${{ matrix.key }}"
        run: |
          status=0
          python3 review-assets/scripts/artifact_fetch.py \
            --repository "$REPOSITORY" --run-id "$RUN_ID" --name "$NAME" \
            --profile session --output accepted >> "$GITHUB_OUTPUT" \
            || status=$?
          case "$status" in
            0) failure='' ;;
            3) failure='the review job produced no session artifact' ;;
            4) failure='the session artifact failed bounded acceptance' ;;
            *) exit "$status" ;;
          esac
          echo "failure=$failure" >> "$GITHUB_OUTPUT"

      - name: 'Check verdict offline'
        id: check
        env:
          KEY: "${{ matrix.key }}"
          MODE: "${{ inputs.mode }}"
          APPROVE_TIERS: "${{ inputs.approve_tiers }}"
          FAILURE: "${{ steps.fetch.outputs.failure }}"
          AGENT_OUTCOMES: "${{ needs.outcomes.outputs.outcomes }}"
        run: |
          extra=()
          if [ -n "$FAILURE" ]; then extra+=(--failure "$FAILURE"); fi
          # This leg's entry in the outcomes job's map, which the
          # antagonistic check reads; an empty or malformed map, or no
          # entry, reads as unknown.
          # shellcheck disable=SC2016  # jq variables, not shell expansions
          outcome="$(jq -rn --arg key "$KEY" --arg map "$AGENT_OUTCOMES" '
            ($map | try fromjson catch null) as $m
            | if ($m | type) == "object" and ($m[$key] | type) == "string"
              then $m[$key] else "unknown" end')"
          mkdir -p accepted artefacts
          case "$MODE" in
            approve)
              python3 review-assets/scripts/apply_review.py check \
                --selection evidence/selection.json --key "$KEY" \
                --session-dir accepted --approve-tiers "$APPROVE_TIERS" \
                --output artefacts/check.json \
                --summary artefacts/check-summary.md "${extra[@]}" \
                >> "$GITHUB_OUTPUT" ;;
            antagonistic)
              python3 review-assets/scripts/comment_review.py check \
                --agent-outcome "$outcome" \
                --selection evidence/selection.json --key "$KEY" \
                --session-dir accepted \
                --output artefacts/check.json \
                --summary artefacts/check-summary.md "${extra[@]}" \
                >> "$GITHUB_OUTPUT" ;;
            *) echo '::error::unknown mode'; exit 1 ;;
          esac
          cat artefacts/check-summary.md >> "$GITHUB_STEP_SUMMARY"

      # The one write this pipeline makes. Minted for one repository,
      # only on the live path, only once the offline check accepted
      # the verdict for the run's mode. Every other path re-reads with
      # the native token, which cannot write anything.
      - name: 'Mint pull request write token'
        id: write-token
        if: >-
          !inputs.dry_run && inputs.github_app_client_id != '' && (
          (inputs.mode == 'approve'
          && steps.check.outputs.approvable == 'true') ||
          (inputs.mode == 'antagonistic'
          && steps.check.outputs.commentable == 'true'))
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: "${{ inputs.github_app_client_id }}"
          private-key: "${{ secrets.github_app_private_key }}"
          owner: "${{ inputs.org }}"
          # The bare name, relative to owner: independent of how the
          # action parses an owner/repository form.
          repositories: "${{ matrix.repo_name }}"
          permission-pull-requests: 'write'
          permission-checks: 'read'
          permission-statuses: 'read'
          permission-metadata: 'read'

      # The one write token: confirm it came from the configured App
      # before it is used. A token scoped to one repository cannot be
      # probed read-only, so identity is the check here.
      - name: 'Pre-flight: write token identity'
        if: steps.write-token.outcome == 'success'
        env:
          MINTED_SLUG: "${{ steps.write-token.outputs.app-slug }}"
          BOT_CONFIG: "${{ needs.select.outputs.bot_config }}"
        run: |
          python3 review-assets/scripts/preflight.py identity \
            --config "review-assets/$BOT_CONFIG" --minted-slug "$MINTED_SLUG"

      # approve submits at most an APPROVE; antagonistic at most a
      # COMMENT review. Each script refuses the other mode's files.
      - name: 'Apply verdict'
        id: apply
        env:
          GH_TOKEN: "${{ steps.write-token.outputs.token || github.token }}"
          MODE: "${{ inputs.mode }}"
          DRY_RUN: "${{ inputs.dry_run }}"
          HANDBACK: "${{ inputs.handback_repository != '' }}"
          RUN_ID: "${{ github.run_id }}"
          RUN_ATTEMPT: "${{ github.run_attempt }}"
          # yamllint disable-line rule:line-length
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          extra=()
          if [ "$DRY_RUN" = true ]; then extra+=(--dry-run); fi
          case "$MODE" in
            approve) command=(apply_review.py apply) ;;
            antagonistic)
              command=(comment_review.py comment)
              extra+=(--run-id "$RUN_ID")
              if [ "$HANDBACK" = true ]; then extra+=(--handback); fi ;;
            *) echo '::error::unknown mode'; exit 1 ;;
          esac
          python3 "review-assets/scripts/${command[0]}" "${command[1]}" \
            --check artefacts/check.json \
            --selection evidence/selection.json \
            --output artefacts/result.json \
            --run-url "$RUN_URL" --run-attempt "$RUN_ATTEMPT" "${extra[@]}"

      # Every selected pull request gets a row in the report. When an
      # earlier step failed before apply wrote a result (the offline
      # check, a token mint, GitHub unreachable), record a typed
      # failure.
      - name: 'Ensure a result exists'
        if: always()
        env:
          KEY: "${{ matrix.key }}"
          REPOSITORY: "${{ matrix.repository }}"
          NUMBER: "${{ matrix.number }}"
          HEAD_SHA: "${{ matrix.head_sha }}"
          DRY_RUN: "${{ inputs.dry_run }}"
          RUN_ATTEMPT: "${{ github.run_attempt }}"
          CHECK_OUTCOME: "${{ steps.check.outcome }}"
          APPLY_OUTCOME: "${{ steps.apply.outcome }}"
        run: |
          # shellcheck disable=SC2016  # jq variables, not shell expansions
          if [ -s artefacts/result.json ]; then exit 0; fi
          mkdir -p artefacts
          usage='{}'
          if [ -s artefacts/check.json ]; then
            usage="$(jq -c '{premium_requests, agent_seconds, url, title}' \
              artefacts/check.json)" || usage='{}'
          fi
          reason="apply did not complete (offline check: $CHECK_OUTCOME,"
          reason="$reason apply: $APPLY_OUTCOME)"
          jq -n --arg key "$KEY" --arg repo "$REPOSITORY" \
            --argjson number "$NUMBER" --arg head "$HEAD_SHA" \
            --arg reason "$reason" --argjson dry "$DRY_RUN" \
            --argjson attempt "$RUN_ATTEMPT" --argjson usage "$usage" '
            def number: if type == "number" then . else null end;
            def text: if type == "string" then . else null end;
            {
              schema: 1, key: $key, repository: $repo, number: $number,
              url: ($usage.url | text), title: ($usage.title | text),
              head_sha: $head, verdict: "failed", tier: null,
              reasons: [$reason], summary: null, findings: [],
              injection_attempts: [], review_url: null,
              dry_run: $dry, run_attempt: $attempt,
              premium_requests: ($usage.premium_requests | number),
              agent_seconds: ($usage.agent_seconds | number)
            }' > artefacts/result.json

      - name: 'Attach apply result'
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # yamllint disable-line rule:line-length
          name: "code-review-result-${{ needs.select.outputs.namespace }}-${{ matrix.key }}-${{ github.run_attempt }}"
          path: |
            artefacts/check.json
            artefacts/check-summary.md
            artefacts/result.json
          retention-days: 90
          if-no-files-found: 'warn'
          # Replaces any artifact a review leg uploaded first under this
          # name: the report trusts only one made inside this step.
          overwrite: true

  report:
    name: 'Report'
    needs: [select, review, apply]
    if: ${{ !cancelled() && needs.select.result == 'success' }}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      actions: read  # Gather result artifacts and their apply jobs
      contents: read  # Checkout the report script
    outputs:
      handback_pulls: "${{ steps.handback.outputs.pulls }}"
      handback_count: "${{ steps.handback.outputs.count }}"
      handback_records: "${{ steps.handback.outputs.records }}"
    steps:
      - name: 'Load egress allow-list'
        if: inputs.harden_runner_egress == 'block'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
        with:
          config: "${{ inputs.harden_runner_allowlist }}"
          # yamllint disable-line rule:line-length
          supplemental_config: "${{ inputs.harden_runner_supplemental_allowlist }}"
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: "${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}"
          # yamllint disable-line rule:line-length
          supplemental_unpinned: "${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}"
          extra_endpoints: "${{ inputs.harden_runner_extra_endpoints }}"
          allow_list_summary: 'false'

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: "${{ inputs.harden_runner_egress }}"
          allowed-endpoints: "${{ env.CONNECTION_ALLOW_LIST }}"

      - name: 'Require trusted provenance'
        env:
          ASSETS_SHA: "${{ needs.select.outputs.assets_sha }}"
          EVIDENCE_ID: "${{ needs.select.outputs.evidence_id }}"
          SELECTION_SHA: "${{ needs.select.outputs.selection_sha256 }}"
          LEDGER_SHA: "${{ needs.select.outputs.ledger_sha256 }}"
        run: |
          [[ "$ASSETS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SELECTION_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$LEDGER_SHA" =~ ^[0-9a-f]{64}$ ]]

      - name: 'Checkout report script'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ needs.select.outputs.assets_sha }}"
          path: 'review-assets'
          persist-credentials: false

      - name: 'Fetch selection evidence'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: "${{ needs.select.outputs.evidence_id }}"
          merge-multiple: true
          path: 'evidence'

      - name: 'Verify evidence bytes'
        env:
          SELECTION_SHA: "${{ needs.select.outputs.selection_sha256 }}"
          LEDGER_SHA: "${{ needs.select.outputs.ledger_sha256 }}"
        run: |
          python3 review-assets/scripts/bot_evidence.py verify \
            --directory evidence --expect "selection.json=$SELECTION_SHA" \
            --expect "ledger.json=$LEDGER_SHA"

      # A bounded fetch, never download-artifact, which would expand a
      # forged archive before anything checked its size. Each result
      # counts as verified only when the run's jobs show the matching
      # apply leg's upload step made it (docs/DESIGN.md section 12);
      # the report keeps every other result out of the ledger.
      - name: 'Gather results'
        if: needs.select.outputs.run_agent == 'true'
        env:
          GH_TOKEN: "${{ github.token }}"
          REPOSITORY: "${{ github.repository }}"
          RUN_ID: "${{ github.run_id }}"
          RUN_ATTEMPT: "${{ github.run_attempt }}"
          NAMESPACE: "${{ needs.select.outputs.namespace }}"
        run: |
          python3 review-assets/scripts/result_fetch.py \
            --repository "$REPOSITORY" --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" --namespace "$NAMESPACE" \
            --selection evidence/selection.json --output results

      - name: 'Build report and ledger'
        env:
          RUN_ID: "${{ github.run_id }}"
          REVIEW_RESULT: "${{ needs.review.result }}"
          APPLY_RESULT: "${{ needs.apply.result }}"
        run: |
          mkdir -p results artefacts ledger
          python3 review-assets/scripts/review_report.py \
            --selection evidence/selection.json --results results \
            --ledger evidence/ledger.json --run-id "$RUN_ID" \
            --output-md artefacts/report.md \
            --output-json artefacts/report.json \
            --output-ledger ledger/ledger.json
          cat artefacts/report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\nReview job: %s; apply job: %s\n' \
            "$REVIEW_RESULT" "$APPLY_RESULT" >> "$GITHUB_STEP_SUMMARY"

      - name: 'Attach run report'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # yamllint disable-line rule:line-length
          name: "code-review-${{ needs.select.outputs.namespace }}-${{ github.run_attempt }}"
          path: 'artefacts/'
          retention-days: 90
          if-no-files-found: 'warn'

      # The next run's select job fetches the newest few of these by
      # name and merges them (scripts/ledger.py). A fixed name per mode
      # is unique within a run, which is all the upload requires.
      - name: 'Publish ledger'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "${{ needs.select.outputs.ledger_name }}"
          path: 'ledger/'
          retention-days: 90
          if-no-files-found: 'error'

      # The pull requests whose posted antagonistic review chose a
      # hand-back, each confirmed against the verified selection and
      # this App's own review on GitHub, whose marker must name this
      # run (scripts/handback.py), as one owner/repo#N list, and a
      # record of each with the review that requested it. A pull
      # request whose head moved, or whose Code Monkey issue already
      # answers that review, is recorded as skipped and left out of
      # the list. Only a live antagonistic run can hand back, so no
      # other reads here. It runs after both uploads so that no
      # failure here costs the run its report or ledger. The native
      # token reads public repositories alone: a candidate it cannot
      # read (private, 5xx, rate limited) is skipped with a warning,
      # never dispatched; a pull request whose delivery check it
      # cannot read stays in the list with a warning.
      - name: 'List hand-backs'
        id: handback
        if: inputs.mode == 'antagonistic' && !inputs.dry_run
        env:
          GH_TOKEN: "${{ github.token }}"
          ORG: "${{ inputs.org }}"
          RUN_ID: "${{ github.run_id }}"
        run: |
          python3 review-assets/scripts/handback.py list \
            --report artefacts/report.json \
            --selection evidence/selection.json \
            --org "$ORG" --run-id "$RUN_ID" >> "$GITHUB_OUTPUT"

  # Hands the reviewed bot pull requests back to their bot for a
  # revision round (docs/DESIGN.md section 19.9): one dispatch of the
  # hand-back repository's code-monkey-cron.yaml per pull request, and
  # a delivery record of each. The only job that holds handback_token,
  # which can dispatch that one workflow and nothing else; it runs no
  # checked-out script and reads one artifact, its own record from an
  # earlier attempt of this run. Its reads of GitHub use the job's own
  # token, which holds no permission and sees public repositories. The
  # applier already capped the rounds, so this job never needs to.
  handback:
    name: 'Hand back for revision'
    needs: [select, report]
    if: >-
      !cancelled() && needs.report.result == 'success' &&
      !inputs.dry_run && inputs.mode == 'antagonistic' &&
      inputs.handback_repository != '' &&
      needs.report.outputs.handback_count != '0' &&
      needs.report.outputs.handback_count != ''
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 'Load egress allow-list'
        if: inputs.harden_runner_egress == 'block'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
        with:
          config: "${{ inputs.harden_runner_allowlist }}"
          # yamllint disable-line rule:line-length
          supplemental_config: "${{ inputs.harden_runner_supplemental_allowlist }}"
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: "${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}"
          # yamllint disable-line rule:line-length
          supplemental_unpinned: "${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}"
          extra_endpoints: "${{ inputs.harden_runner_extra_endpoints }}"
          allow_list_summary: 'false'

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: "${{ inputs.harden_runner_egress }}"
          allowed-endpoints: "${{ env.CONNECTION_ALLOW_LIST }}"

      # A re-run sends only what an earlier attempt of this run has
      # not: the record that attempt uploaded names what it dispatched.
      # A record that cannot be fetched counts as none; at worst that
      # repeats a dispatch, which Code Monkey's round refuses.
      - name: 'Fetch the delivery record'
        if: github.run_attempt != '1'
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: 'code-review-handback'
          merge-multiple: true
          path: 'delivery-prior'

      - name: 'Dispatch the revision round'
        env:
          GH_TOKEN: "${{ secrets.handback_token }}"
          READ_TOKEN: "${{ github.token }}"
          REPOSITORY: "${{ inputs.handback_repository }}"
          PULLS: "${{ needs.report.outputs.handback_pulls }}"
          RECORDS: "${{ needs.report.outputs.handback_records }}"
        run: |
          repo_re='^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9._-]+$'
          ref='[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9._-]+#[1-9][0-9]*'
          [[ "$REPOSITORY" =~ $repo_re ]] || {
            echo '::error::handback_repository must be owner/repo'; exit 1; }
          [[ "$PULLS" =~ ^$ref(\ $ref)*$ ]] || {
            echo '::error::the hand-back list is malformed'; exit 1; }
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::handback_repository is set; handback_token is empty'
            exit 1
          fi
          jq -e 'type == "array"' <<< "$RECORDS" > /dev/null || {
            echo '::error::the hand-back records are malformed'; exit 1; }
          # A pull request goes once per review that requested it; an
          # earlier attempt's record of that pair stands for this one.
          prior='[]'
          if [ -f delivery-prior/handback.json ]; then
            prior=$(jq -c '[.deliveries[]? | select(.state == "dispatched")]
              | unique_by([.pull, .review])' \
              delivery-prior/handback.json) || {
              echo '::warning::the earlier delivery record is unreadable'
              prior='[]'
            }
          fi
          mkdir -p delivery
          deliveries=$(jq -c '[.[] | select(.state == "skipped")]' \
            <<< "$RECORDS")
          # Every checkpoint carries each pair an earlier attempt
          # dispatched, listed or reached in this attempt or not, so an
          # interrupted attempt or a shorter list forgets none. It
          # replaces the last one by a rename, so an interrupted write
          # leaves that one whole for the upload.
          checkpoint() {
            jq -n --argjson prior "$prior" --argjson now "$deliveries" \
              '{schema: 1, deliveries: ($prior + [$now[] | . as $d
                | select(all($prior[];
                    .pull != $d.pull or .review != $d.review))])}' \
              > delivery/handback.json.tmp
            mv -f delivery/handback.json.tmp delivery/handback.json
          }
          # The report's check again, read just before each dispatch with
          # the job's own token: why the hand-back needs no dispatch now
          # (`moved` or `answered`), or nothing. A hand-back-only re-run
          # after a round has published therefore sends nothing. Fails
          # when a read fails, and the caller keeps the pull request.
          needless() {
            local repo=${1%#*} number=${1##*#} review=$2 head=$3 now
            local sha branch author issue comments answered
            now=$(GH_TOKEN="$READ_TOKEN" gh api "repos/$repo/pulls/$number" \
              --jq '[.head.sha, .head.ref, .user.login] | @tsv') || return 1
            IFS=$'\t' read -r sha branch author <<< "$now" || return 1
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || return 1
            if [ "$sha" != "$head" ]; then
              echo "moved: the head moved from ${head:0:12} to ${sha:0:12}"
              return 0
            fi
            [[ "$branch" =~ ^code-monkey/issue-([1-9][0-9]*)$ ]] || return 0
            issue=${BASH_REMATCH[1]}
            comments=$(GH_TOKEN="$READ_TOKEN" gh api --paginate \
              "repos/$repo/issues/$issue/comments?per_page=100") || return 1
            answered=$(jq -n --arg author "$author" --arg review "$review" '
              def who: sub("\\[bot\\]$"; "") | ascii_downcase;
              any(inputs[]; .user.type == "Bot"
                and (.user.login | strings | who) == ($author | who)
                and (.body | strings | test("(^|\n)<!-- code-monkey \\S+ "
                  + "[^\n]*?\\bantagonistic=" + $review + " -->\\s*\\z")))' \
              <<< "$comments") || return 1
            if [ "$answered" = true ]; then
              echo "answered: issue #$issue already answers review $review"
            fi
          }
          checkpoint
          failed=0
          # Code Monkey caps a run at max_pull_requests, named ones
          # included, so each dispatch lifts the cap (0). One pull
          # request per dispatch keeps a failure to that pull request.
          for pull in $PULLS; do
            review=$(jq -r --arg pull "$pull" \
              'first(.[] | select(.pull == $pull) | .review) // empty' \
              <<< "$RECORDS")
            [[ "$review" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::no review is recorded for $pull"; exit 1; }
            head=$(jq -r --arg pull "$pull" \
              'first(.[] | select(.pull == $pull) | .head) // empty' \
              <<< "$RECORDS")
            [[ "$head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::no reviewed head is recorded for $pull"; exit 1; }
            state='' reason=''
            if jq -e --arg pull "$pull" --argjson review "$review" \
              'any(.[]; .pull == $pull and .review == $review)' \
              <<< "$prior" > /dev/null; then
              state=dispatched
              reason='dispatched by an earlier attempt of this run'
            elif ! reason=$(needless "$pull" "$review" "$head"); then
              reason=''
              echo "::warning::$pull kept; its delivery check could not be read"
            elif [ -n "$reason" ]; then
              state=skipped
              echo "::notice::$pull skipped; $reason"
            fi
            if [ -n "$state" ]; then
              :
            elif gh workflow run code-monkey-cron.yaml --repo "$REPOSITORY" \
              -f dry_run=false -f mode=pull-requests -f max_pull_requests=0 \
              -f pull_requests="$pull"; then
              state=dispatched
            else
              state=failed
              reason='the dispatch failed'
              failed=$((failed + 1))
              echo "::warning::$pull: the dispatch failed"
            fi
            deliveries=$(jq -c --arg pull "$pull" --argjson review "$review" \
              --arg state "$state" --arg reason "$reason" \
              '. + [{pull: $pull, review: $review, state: $state}
                + (if $reason == "" then {} else {reason: $reason} end)]' \
              <<< "$deliveries")
            checkpoint
          done
          {
            echo '## Hand-back deliveries'
            echo
            echo "\`code-monkey-cron.yaml\` in \`$REPOSITORY\`:"
            echo
            jq -r '.[] | "- `\(.pull)` (review \(.review)): \(.state)"
              + (if .reason then "; \(.reason)" else "" end)' \
              <<< "$deliveries"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed dispatch(es) failed; re-run the job to retry"
            exit 1
          fi

      # Runs whatever the dispatch did, so a re-run of this job can
      # tell what has gone already. One name per run: each attempt
      # replaces the record with its own, which carries every earlier
      # dispatch forward from its first checkpoint on.
      - name: 'Record the deliveries'
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'code-review-handback'
          path: 'delivery/handback.json'
          overwrite: true
          retention-days: 90
          if-no-files-found: 'ignore'
