---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Scheduled and on-demand entry point for the reusable workflow.
#
# Every three hours on weekdays and twice a day at weekends, scanning
# the whole organisation this repository belongs to. The schedule
# stays in dry-run until the rollout in docs/DESIGN.md clears live
# operation; flip the `dry_run` expression below at that point.
# Disabling this workflow in the Actions UI is the kill switch.
#
# Trusted jobs hold the App key and run in block mode with the
# organisation allow-list; the review job holds the model credential
# alone and never sees the App key (docs/DESIGN.md section 4).
name: 'Code Review Bot ⏰'

# yamllint disable-line rule:truthy
on:
  schedule:
    # Every three hours, Monday to Friday (UTC)
    - cron: '0 */3 * * 1-5'
    # 08:00 and 20:00 UTC, Saturday and Sunday
    - cron: '0 8,20 * * 0,6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the agent and the checks; approve nothing'
        type: boolean
        default: true
      model:
        description: 'Model'
        type: choice
        options:
          - 'Claude Opus 5.5'
          - 'Claude Fable 5.1'
          - 'Claude Sonnet 5.5'
          - 'GPT-6 Astra'
        default: 'Claude Opus 5.5'
      approve_tiers:
        description: 'Tiers the run may approve'
        type: choice
        options:
          - 'trivial,low-risk'
          - 'trivial'
          - 'none'
        default: 'trivial,low-risk'
      pull_requests:
        description: >-
          Review these pull requests instead of scanning
          (repo/pull/N, owner/repo/pull/N, repo#N or URLs; commas
          and/or spaces)
        type: string
        default: ''
      repositories:
        description: 'Repositories to scan (commas and/or spaces)'
        type: string
        default: ''
      max_pull_requests:
        description: 'Pull requests to review at most (0 = no cap)'
        type: string
        default: '20'
      max_concurrent_agents:
        description: 'Review sessions at once (1-30)'
        type: string
        default: '5'
      reassess:
        description: 'Review heads the ledger already records'
        type: boolean
        default: false

permissions: {}

# Serialise live runs of this caller. A group keeps one pending run and
# a newcomer cancels it, so this is not a FIFO queue. A dry dispatch
# writes nothing and takes a group of its own: it neither waits behind
# the schedule nor cancels a pending live run.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run
    && format('code-review-dry-run-{0}', github.run_id)
    || 'code-review' }}
  cancel-in-progress: false

jobs:
  options:
    name: 'Resolve options'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 2
    permissions: {}
    outputs:
      model: "${{ steps.map.outputs.id }}"
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'

      # Display names in the dispatch form map to the identifiers the
      # Copilot CLI accepts (docs/DESIGN.md section 9).
      - name: 'Map display name to identifier'
        id: map
        env:
          MODEL: "${{ inputs.model || 'Claude Opus 5.5' }}"
        run: |
          case "$MODEL" in
            'Claude Opus 5.5') id='claude-opus-5.5' ;;
            'Claude Fable 5.1') id='claude-fable-5.1' ;;
            'Claude Sonnet 5.5') id='claude-sonnet-5.5' ;;
            'GPT-6 Astra') id='gpt-6-astra' ;;
            *) echo "::error::Unknown model $MODEL"; exit 1 ;;
          esac
          echo "id=$id" >> "$GITHUB_OUTPUT"

  code-review:
    name: 'Code Review'
    needs: 'options'
    permissions:
      pull-requests: read  # Candidate scan when running without the App
      contents: read  # Asset checkout and public repository reads
      actions: read  # Ledger, session and result artifact reads
    uses: $/.github/workflows/code-review.yaml
    with:
      # The owner this workflow runs under, which upstream is
      # lfreleng-actions. Naming it this way rather than hard-coding
      # it keeps a fork's scheduled runs inside the fork.
      org: "${{ github.repository_owner }}"
      # Scheduled runs stay dry-run until the rollout clears them; a
      # manual dispatch takes the operator's choice.
      dry_run: >-
        ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
      model: "${{ needs.options.outputs.model }}"
      approve_tiers: "${{ inputs.approve_tiers || 'trivial,low-risk' }}"
      pull_requests: "${{ inputs.pull_requests || '' }}"
      repositories: "${{ inputs.repositories || '' }}"
      max_pull_requests: "${{ inputs.max_pull_requests || '20' }}"
      max_concurrent_agents: "${{ inputs.max_concurrent_agents || '5' }}"
      reassess: ${{ inputs.reassess || false }}
      egress_policy: 'block'
      # yamllint disable-line rule:line-length
      egress_allow_config: '@e0e35011ee145321a51d3226f044ec88dfe645b1'  # v0.16.4
      # Repository-level credentials reach the trusted select and
      # apply jobs, never an action in the review job. No client id
      # permits dry-run fallback; a missing key fails token creation
      # before any session runs.
      github_app_client_id: "${{ vars.BOT_APP_CLIENT_ID || '' }}"
      # Run the pipeline with the assets from the triggering commit.
      assets_repository: "${{ github.repository }}"
      assets_ref: "${{ github.sha }}"
    secrets:
      copilot_token: "${{ secrets.COPILOT_CLI_TOKEN }}"
      github_app_private_key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"
