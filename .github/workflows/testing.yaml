---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Exercises the reusable code-review workflow.
#
# Pull request runs are SECRETLESS by design: a same-repository PR
# can modify the local reusable workflow and asset scripts, so a PR
# check that held a model credential would hand it to the code
# under review. PR runs therefore set skip_agent, proving the
# plumbing (ledger fetch, selection, evidence upload, report) from
# the PR head without any secret in reach.
#
# The full agent session -- dry-run, read-only -- runs from
# workflow_dispatch instead: a maintainer triggers it explicitly
# against a chosen ref, which is the trusted, approval-gated
# execution path for validating agent behaviour before merge.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Review mode for the manual dry-run'
        type: choice
        options:
          - 'approve'
          - 'antagonistic'
        default: 'approve'
      pull_requests:
        description: 'Pull requests for the manual dry-run (see cron form)'
        type: string
        default: ''
      repositories:
        description: 'Repositories for the manual dry-run (commas/spaces)'
        type: string
        default: ''
      max_pull_requests:
        description: 'Pull requests to review in the manual dry-run'
        type: string
        default: '2'

permissions: {}

# A new push to a pull request supersedes that pull request's older
# run. Each manual dispatch takes a group of its own, so a second
# dispatch never cancels an agent session already in flight.
concurrency:
  group: >-
    ${{ format('testing-{0}', github.event_name == 'pull_request'
    && github.ref || github.run_id) }}
  cancel-in-progress: true

jobs:
  plumbing:
    name: 'Plumbing (secretless, ${{ matrix.mode }})'
    strategy:
      matrix:
        # One leg per review mode. Both are dry, so they share only
        # this run's lock: one runs, one waits; their distinct
        # namespaces also prove invocations never collide.
        mode: ['approve', 'antagonistic']
    if: github.event_name == 'pull_request'
    permissions:
      # The job passes no secrets and skips the agent session, so
      # even a malicious PR-head script holds nothing but reads.
      pull-requests: read  # Candidate scan
      contents: read  # Asset checkout and public repository reads
      actions: read  # Ledger and result artifact reads
    uses: $/.github/workflows/code-review.yaml
    with:
      # The owner running the test, so a fork exercises its own
      # organisation rather than reaching into the upstream one.
      org: "${{ github.repository_owner }}"
      mode: "${{ matrix.mode }}"
      approve_tiers: >-
        ${{ matrix.mode == 'antagonistic' && 'none' || 'trivial,low-risk' }}
      dry_run: true
      # Skip the agent: PR runs are secretless (see header comment).
      skip_agent: true
      max_pull_requests: '3'
      # Block mode with the organisation allow-list, as the scheduled
      # caller runs, so a pull request proves the trusted jobs' egress.
      harden_runner_egress: 'block'
      # yamllint disable-line rule:line-length
      harden_runner_allowlist: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      assets_repository: >-
        ${{ github.event.pull_request.head.repo.full_name }}
      assets_ref: "${{ github.event.pull_request.head.sha }}"

  dry-run:
    name: 'Agent dry-run (manual)'
    if: github.event_name == 'workflow_dispatch'
    permissions:
      pull-requests: read  # Candidate scan
      contents: read  # Asset checkout and public repository reads
      actions: read  # Ledger, session and result artifact reads
    uses: $/.github/workflows/code-review.yaml
    with:
      org: "${{ github.repository_owner }}"
      mode: "${{ inputs.mode || 'approve' }}"
      approve_tiers: >-
        ${{ inputs.mode == 'antagonistic' && 'none' || 'trivial,low-risk' }}
      dry_run: true
      pull_requests: "${{ inputs.pull_requests || '' }}"
      repositories: "${{ inputs.repositories || '' }}"
      max_pull_requests: "${{ inputs.max_pull_requests || '2' }}"
      max_concurrent_agents: '2'
      harden_runner_egress: 'block'
      # yamllint disable-line rule:line-length
      harden_runner_allowlist: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      assets_repository: "${{ github.repository }}"
      assets_ref: "${{ github.sha }}"
    secrets:
      # Personal fine-grained PAT with Copilot Requests and no
      # repository grants. Native caller tokens are not supported.
      copilot_token: "${{ secrets.COPILOT_CLI_TOKEN }}"

  regression:
    name: 'Offline regression tests'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: read  # Test checked-out code without write credentials
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Install uv'
        id: setup-uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          working-directory: "${{ runner.temp }}"
          tool-bin-dir: "${{ runner.temp }}/uv-tool-bin"
          # The post-step cache prune would hit the invalid preference.
          enable-cache: false
        env:
          UV_NO_CONFIG: '1'
          UV_NO_PROJECT: '1'
          # setup-uv's only uv call here is "uv python find", whose
          # result it executes; an invalid preference makes uv refuse
          # its arguments before any lookup.
          UV_PYTHON_PREFERENCE: 'lookup-disabled'
          # Inherited, it makes setup-uv probe uv, which the line above
          # fails.
          UV_PYTHON_ARCH: ''
          # setup-uv puts this directory on PATH ahead of its own uv and
          # then runs a bare uv, so an inherited value could name a
          # directory holding another uv; pin it to the one the
          # "Install Python" step installs into.
          UV_PYTHON_INSTALL_DIR: "${{ runner.temp }}/uv-python"

      # The one interpreter every later uv call names by absolute path.
      # uv installs it with an emptied environment, so no variable the
      # job carries can steer the install or the lookup, and the result
      # must sit in the directory it was installed to. It runs outside
      # the checkout: uv python find starts a .venv/bin/python in its
      # working directory to query it, even under env -i.
      - name: 'Install Python'
        id: python
        shell: bash
        working-directory: "${{ runner.temp }}"
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          INSTALL_DIR: "${{ runner.temp }}/uv-python"
        run: |
          clean=(UV_NO_CONFIG=1 UV_NO_PROJECT=1
            "UV_PYTHON_INSTALL_DIR=$INSTALL_DIR"
            "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache")
          for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy \
              https_proxy all_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR \
              UV_NATIVE_TLS; do
            if value="$(printenv "$name")"; then clean+=("$name=$value"); fi
          done
          env -i "${clean[@]}" "$UV" python install --quiet --no-bin 3.13
          py="$(env -i "${clean[@]}" "$UV" python find --managed-python 3.13)"
          case "$py" in
            "$INSTALL_DIR"/*) ;;
            *) echo "::error::uv found Python outside its install directory"
               exit 1 ;;
          esac
          echo "path=$py" >> "$GITHUB_OUTPUT"

      - name: 'Run offline regression suite'
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          PYTHON: "${{ steps.python.outputs.path }}"
        run: |
          "$UV" run --locked --python "$PYTHON" \
            python -B -m unittest discover -s tests -v

  # The select job's uv steps must not run a Python interpreter that
  # the workspace or the job's environment chose (docs/DESIGN.md
  # section 4.4). This plants interpreters that record any run where
  # uv would look for them, runs exact copies of those steps (the
  # contract tests keep them identical), and fails if a planted
  # interpreter ran. Each leg plants one set of the variables a
  # caller-controlled step could export to later ones.
  uv-isolation:
    name: 'uv interpreter isolation (${{ matrix.route }})'
    strategy:
      fail-fast: false
      matrix:
        route: ['uv-python', 'virtual-env']
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    permissions:
      contents: read  # Check out this repository as the assets
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      - name: 'Checkout trusted assets'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 'review-assets'
          persist-credentials: false

      # A .venv and a .python-version in the workspace root and in the
      # assets checkout, each naming an interpreter that appends its
      # own path to the mark and then runs the system Python; and a
      # uv.toml in the root demanding a uv release that cannot run.
      # The root .venv/bin also holds a python3.13 and a uv that
      # append to the mark and fail, and goes on PATH for later steps,
      # with the leg's variables naming it through GITHUB_ENV. A root
      # .uv-python holds another such uv, and UV_PYTHON_INSTALL_DIR
      # names it in both legs.
      - name: 'Plant workspace interpreters'
        env:
          ROUTE: "${{ matrix.route }}"
        run: |
          mark="$RUNNER_TEMP/planted-interpreter-ran"
          real="$(command -v python3)"
          version="$("$real" -c \
            'import sys; print("%d.%d.%d" % sys.version_info[:3])')"
          for dir in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/review-assets"; do
            mkdir -p "$dir/.venv/bin" "$dir/.planted"
            for python in "$dir/.venv/bin/python" "$dir/.planted/python"; do
              printf '#!/bin/sh\necho %q >> %q\nexec %q "$@"\n' \
                "$python" "$mark" "$real" > "$python"
              chmod +x "$python"
            done
            ln -s python "$dir/.venv/bin/python3"
            printf 'home = %s\nversion = %s\n' \
              "$(dirname "$real")" "$version" > "$dir/.venv/pyvenv.cfg"
            echo "$dir/.planted/python" > "$dir/.python-version"
          done
          echo 'required-version = "==0.0.1"' > "$GITHUB_WORKSPACE/uv.toml"
          venv="$GITHUB_WORKSPACE/.venv"
          pydir="$GITHUB_WORKSPACE/.uv-python"
          mkdir -p "$pydir"
          for bait in "$venv/bin/python3.13" "$venv/bin/uv" "$pydir/uv"; do
            printf '#!/bin/sh\necho %q >> %q\nexit 1\n' \
              "$bait" "$mark" > "$bait"
            chmod +x "$bait"
          done
          mkdir -p "$venv/conda-meta"
          echo "$venv/bin" >> "$GITHUB_PATH"
          {
            case "$ROUTE" in
              uv-python)
                echo "UV_PYTHON=$venv/bin/python3.13"
                echo "UV_PYTHON_SEARCH_PATH=$venv/bin" ;;
              virtual-env)
                echo "VIRTUAL_ENV=$venv"
                echo "CONDA_PREFIX=$venv"
                echo "UV_INTERNAL__PARENT_INTERPRETER=$venv/bin/python3.13" ;;
              *) echo "::error::Unknown route $ROUTE" >&2
                 exit 1 ;;
            esac
            echo "UV_PYTHON_ARCH=$(uname -m)"
            echo "UV_PYTHON_INSTALL_DIR=$pydir"
            echo 'UV_NO_CACHE=1'
          } >> "$GITHUB_ENV"

      - name: 'Set up uv'
        id: setup-uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          working-directory: "${{ runner.temp }}"
          tool-bin-dir: "${{ runner.temp }}/uv-tool-bin"
          # The post-step cache prune would hit the invalid preference.
          enable-cache: false
        env:
          UV_NO_CONFIG: '1'
          UV_NO_PROJECT: '1'
          # setup-uv's only uv call here is "uv python find", whose
          # result it executes; an invalid preference makes uv refuse
          # its arguments before any lookup.
          UV_PYTHON_PREFERENCE: 'lookup-disabled'
          # Inherited, it makes setup-uv probe uv, which the line above
          # fails.
          UV_PYTHON_ARCH: ''
          # setup-uv puts this directory on PATH ahead of its own uv and
          # then runs a bare uv, so an inherited value could name a
          # directory holding another uv; pin it to the one the
          # "Install Python" step installs into.
          UV_PYTHON_INSTALL_DIR: "${{ runner.temp }}/uv-python"

      # The one interpreter every later uv call names by absolute path.
      # uv installs it with an emptied environment, so no variable the
      # job carries can steer the install or the lookup, and the result
      # must sit in the directory it was installed to. It runs outside
      # the checkout: uv python find starts a .venv/bin/python in its
      # working directory to query it, even under env -i.
      - name: 'Install Python'
        id: python
        shell: bash
        working-directory: "${{ runner.temp }}"
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          INSTALL_DIR: "${{ runner.temp }}/uv-python"
        run: |
          clean=(UV_NO_CONFIG=1 UV_NO_PROJECT=1
            "UV_PYTHON_INSTALL_DIR=$INSTALL_DIR"
            "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache")
          for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy \
              https_proxy all_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR \
              UV_NATIVE_TLS; do
            if value="$(printenv "$name")"; then clean+=("$name=$value"); fi
          done
          env -i "${clean[@]}" "$UV" python install --quiet --no-bin 3.13
          py="$(env -i "${clean[@]}" "$UV" python find --managed-python 3.13)"
          case "$py" in
            "$INSTALL_DIR"/*) ;;
            *) echo "::error::uv found Python outside its install directory"
               exit 1 ;;
          esac
          echo "path=$py" >> "$GITHUB_OUTPUT"

      - name: 'Install zizmor'
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          PYTHON: "${{ steps.python.outputs.path }}"
          UV_NO_CONFIG: '1'
          UV_NO_PROJECT: '1'
        run: |
          "$UV" tool install --python "$PYTHON" 'zizmor==1.30.1'

      - name: 'Pre-flight: workflow contracts and audit'
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          PYTHON: "${{ steps.python.outputs.path }}"
          UV_PROJECT_ENVIRONMENT: "${{ runner.temp }}/preflight-venv"
        run: |
          cd review-assets
          "$UV" run --locked --python "$PYTHON" \
            python -B scripts/preflight.py workflow --root .

      - name: 'Check no planted interpreter ran'
        if: always()
        run: |
          mark="$RUNNER_TEMP/planted-interpreter-ran"
          if [ -e "$mark" ]; then
            echo '::error::A planted workspace interpreter ran'
            cat "$mark"
            exit 1
          fi

      # The control: the same lookups without an absolute --python
      # must start the bait, or the check above proved nothing.
      - name: 'Control: unguarded uv starts the bait'
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
        run: |
          mark="$RUNNER_TEMP/planted-interpreter-ran"
          cd "$RUNNER_TEMP"
          "$UV" python find --system --no-project --no-config || true
          "$UV" run --no-config --no-project python -c pass || true
          if [ ! -e "$mark" ]; then
            echo '::error::No planted interpreter ran; the bait is dead'
            exit 1
          fi
          cat "$mark"

  docs:
    name: 'Documentation build'
    if: github.event_name == 'pull_request'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read  # Check out the documentation sources
    timeout-minutes: 10
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install uv'
        id: setup-uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          working-directory: "${{ runner.temp }}"
          tool-bin-dir: "${{ runner.temp }}/uv-tool-bin"
          # The post-step cache prune would hit the invalid preference.
          enable-cache: false
        env:
          UV_NO_CONFIG: '1'
          UV_NO_PROJECT: '1'
          # setup-uv's only uv call here is "uv python find", whose
          # result it executes; an invalid preference makes uv refuse
          # its arguments before any lookup.
          UV_PYTHON_PREFERENCE: 'lookup-disabled'
          # Inherited, it makes setup-uv probe uv, which the line above
          # fails.
          UV_PYTHON_ARCH: ''
          # setup-uv puts this directory on PATH ahead of its own uv and
          # then runs a bare uv, so an inherited value could name a
          # directory holding another uv; pin it to the one the
          # "Install Python" step installs into.
          UV_PYTHON_INSTALL_DIR: "${{ runner.temp }}/uv-python"

      # The one interpreter every later uv call names by absolute path.
      # uv installs it with an emptied environment, so no variable the
      # job carries can steer the install or the lookup, and the result
      # must sit in the directory it was installed to. It runs outside
      # the checkout: uv python find starts a .venv/bin/python in its
      # working directory to query it, even under env -i.
      - name: 'Install Python'
        id: python
        shell: bash
        working-directory: "${{ runner.temp }}"
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          INSTALL_DIR: "${{ runner.temp }}/uv-python"
        run: |
          clean=(UV_NO_CONFIG=1 UV_NO_PROJECT=1
            "UV_PYTHON_INSTALL_DIR=$INSTALL_DIR"
            "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache")
          for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy \
              https_proxy all_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR \
              UV_NATIVE_TLS; do
            if value="$(printenv "$name")"; then clean+=("$name=$value"); fi
          done
          env -i "${clean[@]}" "$UV" python install --quiet --no-bin 3.13
          py="$(env -i "${clean[@]}" "$UV" python find --managed-python 3.13)"
          case "$py" in
            "$INSTALL_DIR"/*) ;;
            *) echo "::error::uv found Python outside its install directory"
               exit 1 ;;
          esac
          echo "path=$py" >> "$GITHUB_OUTPUT"

      # Proves the site builds from the pull request head without
      # granting it any Pages permission; the deployment lives in
      # documentation.yaml and runs from the default branch alone.
      - name: 'Build documentation'
        shell: bash
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          PYTHON: "${{ steps.python.outputs.path }}"
          UV_NO_CONFIG: '1'
          UV_NO_PROJECT: '1'
        run: |
          venv="$RUNNER_TEMP/docs-venv"
          "$UV" venv --python "$PYTHON" "$venv"
          "$UV" pip install --python "$venv/bin/python" --require-hashes \
            --requirement docs/requirements.txt
          "$venv/bin/mkdocs" build --strict
