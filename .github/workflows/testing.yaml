---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Exercises the reusable code-review workflow.
#
# Pull request runs are SECRETLESS by design: a same-repository PR
# can modify the local reusable workflow and asset scripts, so a PR
# check that held a model credential would hand it to the code
# under review. PR runs therefore set skip_agent, proving the
# plumbing (ledger fetch, selection, evidence upload, report) from
# the PR head without any secret in reach.
#
# The full agent session -- dry-run, read-only -- runs from
# workflow_dispatch instead: a maintainer triggers it explicitly
# against a chosen ref, which is the trusted, approval-gated
# execution path for validating agent behaviour before merge.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  pull_request:
  workflow_dispatch:
    inputs:
      pull_requests:
        description: 'Pull requests for the manual dry-run (see cron form)'
        type: string
        default: ''
      repositories:
        description: 'Repositories for the manual dry-run (commas/spaces)'
        type: string
        default: ''
      max_pull_requests:
        description: 'Pull requests to review in the manual dry-run'
        type: string
        default: '2'

permissions: {}

# A new push to a pull request supersedes that pull request's older
# run. Each manual dispatch takes a group of its own, so a second
# dispatch never cancels an agent session already in flight.
concurrency:
  group: >-
    ${{ format('testing-{0}', github.event_name == 'pull_request'
    && github.ref || github.run_id) }}
  cancel-in-progress: true

jobs:
  plumbing:
    name: 'Plumbing (secretless, ${{ matrix.invocation }})'
    strategy:
      matrix:
        # Two legs prove invocation namespaces never collide. Both are
        # dry, so they share only this run's lock: one runs, one waits.
        invocation: [first, second]
    if: github.event_name == 'pull_request'
    permissions:
      # The job passes no secrets and skips the agent session, so
      # even a malicious PR-head script holds nothing but reads.
      pull-requests: read  # Candidate scan
      contents: read  # Asset checkout and public repository reads
      actions: read  # Ledger and result artifact reads
    uses: $/.github/workflows/code-review.yaml
    with:
      # The owner running the test, so a fork exercises its own
      # organisation rather than reaching into the upstream one.
      org: "${{ github.repository_owner }}"
      dry_run: true
      # Skip the agent: PR runs are secretless (see header comment).
      skip_agent: true
      max_pull_requests: '3'
      # Block mode with the organisation allow-list, as the scheduled
      # caller runs, so a pull request proves the trusted jobs' egress.
      egress_policy: 'block'
      # yamllint disable-line rule:line-length
      egress_allow_config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
      assets_repository: >-
        ${{ github.event.pull_request.head.repo.full_name }}
      assets_ref: "${{ github.event.pull_request.head.sha }}"

  dry-run:
    name: 'Agent dry-run (manual)'
    if: github.event_name == 'workflow_dispatch'
    permissions:
      pull-requests: read  # Candidate scan
      contents: read  # Asset checkout and public repository reads
      actions: read  # Ledger, session and result artifact reads
    uses: $/.github/workflows/code-review.yaml
    with:
      org: "${{ github.repository_owner }}"
      dry_run: true
      pull_requests: "${{ inputs.pull_requests || '' }}"
      repositories: "${{ inputs.repositories || '' }}"
      max_pull_requests: "${{ inputs.max_pull_requests || '2' }}"
      max_concurrent_agents: '2'
      egress_policy: 'block'
      # yamllint disable-line rule:line-length
      egress_allow_config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
      assets_repository: "${{ github.repository }}"
      assets_ref: "${{ github.sha }}"
    secrets:
      # Personal fine-grained PAT with Copilot Requests and no
      # repository grants. Native caller tokens are not supported.
      copilot_token: "${{ secrets.COPILOT_CLI_TOKEN }}"

  regression:
    name: 'Offline regression tests'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: read  # Test checked-out code without write credentials
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'audit'
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: 'Run offline regression suite'
        run: uv run --locked python -B -m unittest discover -s tests -v

  docs:
    name: 'Documentation build'
    if: github.event_name == 'pull_request'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read  # Check out the documentation sources
    timeout-minutes: 10
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      # Proves the site builds from the pull request head without
      # granting it any Pages permission; the deployment lives in
      # documentation.yaml and runs from the default branch alone.
      - name: 'Build documentation'
        shell: bash
        run: |
          uv venv --python 3.13
          uv pip install --require-hashes \
            --requirement docs/requirements.txt
          .venv/bin/mkdocs build --strict
